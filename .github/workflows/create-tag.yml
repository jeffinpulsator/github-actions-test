name: Create Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(python -c "import version; print(version.VERSION_NAME)")
          BUILD_NO=$(python -c "import version; print(version.BUILD_NO)")

          echo "VERSION_NAME: $VERSION_NAME"
          echo "BUILD_NO: $BUILD_NO"

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NO" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          TAG_NAME="v${{ steps.version.outputs.version }}"

          echo "Tag name: $TAG_NAME"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG_NAME already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Successfully created tag: $TAG_NAME"
