name: Version Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compare Versions
        run: python .github/scripts/version_check.py

      - name: Show sdkconfig changes
        run: git diff -- sdkconfig
