name: Version Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get version check script
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/version_check.py > /tmp/version_check.py

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compare Versions
        run: python /tmp/version_check.py

      - name: Show sdkconfig changes
        run: git diff -- sdkconfig

      - name: Commit sdkconfig
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add sdkconfig
      
          if git diff --cached --quiet; then
            echo "No sdkconfig changes to commit."
          else
            git commit -m "Update sdkconfig for release"
            git push origin HEAD:${{ github.head_ref }}
          fi
